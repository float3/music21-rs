[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.26"]

[project]
authors = [{ name = "hill", email = "hill@hilll.dev" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
# Released with the music21-rs wheel and at its version, since it builds on
# that wheel's `_HarteLabel`: `harte_rs_requires_its_own_music21_rs` holds
# both numbers to python/Cargo.toml's.
dependencies = ["music21-rs==0.20.0"]
description = "Harte chord notation read into music21-rs chords; a replacement for harte-library"
keywords = ["music", "music-theory", "chords", "harte", "music21"]
license = "AGPL-3.0-only"
license-files = ["LICENSE-harte-library"]
name = "harte-rs"
readme = "README.md"
requires-python = ">=3.9"
version = "0.20.0"

[project.urls]
Repository = "https://github.com/float3/music21-rs"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["harte"]
