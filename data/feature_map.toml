# ---------------------------------------------------------------------------
# What the crate has that music21 does not.
#
# The counts are not written here: each names a Rust `const` whose declared
# length is read out of the source, so a table that grows says so by itself
# and the report fails when one of these can no longer be found.
# ---------------------------------------------------------------------------

[[beyond]]
name = "Polyrhythm"
rust = "src/polyrhythm.rs"
note = "Cross-rhythms as a first-class thing: the cycle two or more pulses make together, where the hits fall in it, and the chord that cycle maps onto when its ratios are read as pitches. music21 has no counterpart."

[[beyond]]
name = "Tuning systems"
rust = "src/tuningsystem/mod.rs"
count = "ALL_TUNING_SYSTEMS"
unit = "systems"
note = "Exact ratio tables - just intonation, meantone, Bohlen-Pierce, the Carlos scales - with frequencies derived from the ratios rather than from equal temperament, and available with no features turned on. Fourteen of them are the historical keyboard temperaments, Salinas 1577 through Lehman 2005, reachable together as HISTORICAL_TEMPERAMENTS; they are counted here rather than again, being the same tables. 23 of the 28 are in the bundled Scala archive too - the same scales stored the other way, exact ratios against parsed cents - which is deliberate and pinned by a test. music21 tunes a scale only by reading a Scala file."

[[beyond]]
name = "Adaptive tuning"
rust = "src/tuningsystem/adaptive.rs"
note = "Tuning where a pitch's frequency depends on the harmony it is sounding in rather than on a fixed table - recursive just intonation over the harmonic series."

[[beyond]]
name = "Scala archive"
scala_archive = true
unit = "scales"
note = "Every scale music21 ships, plus the hexatone collection, parsed into one table at build time rather than read from disk. The reader also handles the inline comments and EDO notation that music21's own parser mis-reads."

[[beyond]]
name = "Regular temperaments"
rust = "src/tuningsystem/temperaments_generated.rs"
count = "WIKI_TEMPERAMENTS"
unit = "temperaments"
note = "A mapping from the primes onto a period and its generators, the commas it tempers out, and the scales that come of stacking it. Every one is checked against the Xenharmonic Wiki, so a mistranscribed number fails the build."

[[beyond]]
name = "Monzos and vals"
rust = "src/tuningsystem/monzo.rs"
note = "An interval as the exponents of the primes in its ratio, so 81/80 is [-4 4 -1>, and how many steps of a tuning each prime is worth, 12edo being <12 19 28]. A val mapping a comma to nothing tempers it out."

[[beyond]]
name = "Moments of symmetry"
rust = "src/tuningsystem/mos.rs"
note = "The scales a single generator makes. Seven fifths folded into an octave give exactly two step sizes, which is the diatonic scale, 5L 2s. The pattern is kept apart from the tuning, and nothing assumes the period is an octave."

[[beyond]]
name = "Equal divisions of anything"
rust = "src/tuningsystem/equal.rs"
note = "Equal steps of any interval, not only of the octave: Bohlen-Pierce divides a twelfth into thirteen. The octave-repeating tables above cannot express those by construction."

[[beyond]]
name = "Duplicate detection"
rust = "src/tuningsystem/duplicates.rs"
note = "Which of these are the same tuning under another name, compared by sound rather than spelling. It finds 44 groups of repeats among the archive's 3,994 scales."
