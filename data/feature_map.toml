# Which music21 classes the crate ports, and where. Read by
# `cargo run -p xtask -- report`, which lists every public method of each
# class against the `pub fn`s of the Rust files named here.
#
# A member is found by convention — `isMajorTriad` is `is_major_triad`, and a
# leading `get` may be dropped — so only the names that differ need a line in
# `renames`. `excluded` lists members left out on purpose, each with the
# reason, and those show on the page as excluded rather than missing. The
# command fails if a rename points at a function that does not exist or an
# exclusion names a member music21 no longer has.

[[class]]
python = "chord/__init__.py"
name = "Chord"
rust = ["src/chord/mod.rs"]
note = "Chord analysis; the stream, display and volume machinery is out of scope."

[class.renames]
forteClassTnI = "forte_class_tni"
getChordStep = "chord_step"
getZRelation = "z_relation"
intervalVector = "interval_class_vector"
orderedPitchClasses = "pitch_classes"

[class.excluded]
add = "notes are given at construction; a chord is a value here"
chordTablesAddress = "the table address is internal; every value read off it has its own method"
formatVectorString = "the vector strings come from interval_vector_string, normal_order_string and prime_form_string"
getColor = "colour, notehead and stem direction are display state"
setColor = "colour, notehead and stem direction are display state"
getNotehead = "colour, notehead and stem direction are display state"
setNotehead = "colour, notehead and stem direction are display state"
getNoteheadFill = "colour, notehead and stem direction are display state"
setNoteheadFill = "colour, notehead and stem direction are display state"
getStemDirection = "colour, notehead and stem direction are display state"
setStemDirection = "colour, notehead and stem direction are display state"
getTie = "tie, volume and notehead are notation state the crate does not model"
setTie = "tie, volume and notehead are notation state the crate does not model"
getVolume = "tie, volume and notehead are notation state the crate does not model"
setVolume = "tie, volume and notehead are notation state the crate does not model"
annotateIntervals = "writes lyrics onto notes in a stream"

