# Which music21 classes the crate ports, and where. Read by
# `cargo run -p xtask -- report`, which lists every public method of each
# class against the `pub fn`s of the Rust files named here.
#
# A member is found by convention — `isMajorTriad` is `is_major_triad`, and a
# leading `get` may be dropped — so only the names that differ need a line in
# `renames`. `excluded` lists members left out on purpose, each with the
# reason, and those show on the page as excluded rather than missing. The
# command fails if a rename points at a function that does not exist or an
# exclusion names a member music21 no longer has.

[[class]]
python = "chord/__init__.py"
name = "Chord"
rust = ["src/chord/mod.rs", "src/note/mod.rs"]
note = "Chord analysis and the notation its notes carry. The per-note getters and setters music21 deprecated in v11 are the note's own methods here, reached through `notes_mut`."

[class.renames]
forteClassTnI = "forte_class_tni"
getNotehead = "notehead"
setNotehead = "set_notehead"
getNoteheadFill = "notehead_fill"
setNoteheadFill = "set_notehead_fill"
getStemDirection = "stem_direction"
setStemDirection = "set_stem_direction"
getChordStep = "chord_step"
getZRelation = "z_relation"
intervalVector = "interval_class_vector"
