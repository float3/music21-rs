# Which music21 classes the crate ports, and where. Read by
# `cargo run --release -p xtask -- report`, which lists every public method of each
# class against the `pub fn`s of the Rust files named here.
#
# A member is found by convention — `isMajorTriad` is `is_major_triad`, and a
# leading `get` may be dropped — so only the names that differ need a line in
# `renames`. `excluded` lists members left out on purpose, each with the
# reason, and those show on the page as excluded rather than missing. The
# command fails if a rename points at a function that does not exist or an
# exclusion names a member music21 no longer has.
#
# What is deliberately not here, and why. The readers and the writers --
# `musicxml/xmlToM21.py` and `m21ToXml.py`, `midi/translate.py`,
# `abcFormat/translate.py`, `humdrum/spineParser.py`, `mei/base.py`,
# `noteworthy`, `musedata`, `capella`, `romanText/translate.py`,
# `tinyNotation.py`, `volpiano.py`, `lily` -- are ported as one function in
# and one function out, with every step inside private, and each is held to
# music21 by a parity test that compares whole documents rather than
# members: `musicxml_parity` byte for byte on 44 corpus scores,
# `midi_write_parity` on 647, `abc_read_parity` on 12,978 tunes, and so on.
# Listing their hundreds of private steps would say nothing a reader does
# not already know from "every corpus file agrees". The same goes for
# music21's own small helper modules (`meter/tools.py`, `musedata/base40.py`,
# `chord/tools.py`, `sorting.py`, `common/numberTools.py`,
# `midi/percussion.py`, whose mapping between a percussion key and the
# instrument that plays it is `percussion_instrument` in the MIDI reader and
# `Instrument::percussion_pitch` in its writer), whose content
# the crate ports where it uses it rather than as a module of its own; and
# for what the crate does not model at all: the page (`graph`), the
# environment and the corpus cache (`environment.py`, `configure.py`,
# `metadata/bundles.py`, `metadata/caching.py`), file conversion
# (`converter`), and music21's own object machinery (`base.py`,
# `prebase.py`, `sites.py`, `derivation.py`, `freezeThaw.py`,
# `stream/iterator.py`, `stream/filters.py`).
#
# Two more files are ported and deliberately not listed as classes.
# `features/jSymbolic.py`'s 72 extractors and `features/native.py`'s 24 are
# rows of a table generated from music21's own classes rather than a class
# each -- id, name, description, size, flags and a function writing the
# vector -- which `features_parity` checks against those live classes and
# every vector on corpus scores. And `figuredBass/rules.py`'s `Rules` is
# twelve switches with no method on it at all and no `__slots__` to read
# them off, so a scan finds nothing to track; it is `figuredbass::Rules`
# here, every switch of it, and music21's own `figuredBass.rules`
# docstrings run against it (`doctest_rules`).
#
# Every file this prose waves at is named one by one in the `[[unlisted]]`
# table at the end, with the same reason, and `xtask report` checks that
# table against the submodule: a module that is neither read above nor
# named there fails the report, as does a name music21 no longer has. So
# the prose and the data cannot drift apart, and a module nobody has
# looked at cannot stay invisible.

