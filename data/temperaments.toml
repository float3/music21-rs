# Regular temperaments, as the Xenharmonic Wiki publishes them.
#
# Hand-collected, not generated: the wiki sits behind a bot check that returns
# 403 to every non-browser client, so no `xtask regenerate-*` command can fetch
# this. Refresh it by hand every few months. Each entry records the `revid` of
# the page it was read from, so a refresh can tell which pages actually
# changed. `xtask emit-temperaments` turns this into
# `src/tuningsystem/temperaments_generated.rs`, and `xtask verify-temperaments`
# (run in CI's lint job) asserts the two agree.
#
# To collect it again, open https://en.xen.wiki in a real browser -- the check
# clears itself, no captcha -- then read the pages carrying `Infobox regtemp`
# through the API on that same origin:
#
#   /api.php?action=query&list=embeddedin&eititle=Template:Infobox regtemp
#             &eilimit=500&einamespace=0&format=json&formatversion=2
#   /api.php?action=query&prop=revisions&rvprop=content|ids&rvslots=main
#             &rvsection=0&format=json&formatversion=2&titles=A|B|C
#
# How to read an infobox `Mapping`. It is `periods; row; row; ...`: the first
# number is how many periods there are to an equave, and each row after it says
# how many of one generator every prime *after the equave* is worth. So a row
# is always one shorter than the subgroup, and that is what says which of the
# listed subgroups the mapping belongs to -- it is not always the last. The
# equave is the subgroup's first prime, which is 2 for all but five of these;
# `3.5.7` repeats at a tritave. A page whose `Generators tuning` lists one more
# number than it has rows is giving the period first.
#
# Only the numbers are taken. The wiki is CC BY-SA and this crate is
# AGPL-3.0-only, so no prose is copied across; mappings, generators, commas and
# MOS patterns are facts and carry no licence weight.
#
# Nothing here is trusted. `wiki_temperaments_build_and_agree_with_the_wiki`
# builds every entry, checks each comma really is tempered out, and checks each
# published MOS pattern really comes out of the generator, so a mistranscribed
# number fails the build rather than shipping.

