# Source of truth for the tuning-system ratio tables.
#
# Regenerate with `cargo run -p xtask -- regenerate-tuning-tables`, which
# re-reads every table that declares `scala_file` from music21's Scala
# archive in the `music21` submodule. Tables without one are maintained by
# hand and are carried through untouched.
#
# Emit the Rust with `cargo run -p xtask -- emit-tuning-tables`.

[[table]]
name = "JUST_INTONATION"
doc = "Twelve-tone just intonation ratios."
scala_file = "carlos_harm.scl"
scala_description = "Carlos Harmonic & Ben Johnston's scale of 'Blues' from Suite f.micr.piano (1977) & David Beardsley's scale of 'Science Friction'"
ratios = [
    [1, 1],
    [17, 16],
    [9, 8],
    [19, 16],
    [5, 4],
    [21, 16],
    [11, 8],
    [3, 2],
    [13, 8],
    [27, 16],
    [7, 4],
    [15, 8],
]

