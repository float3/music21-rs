# Every Python object a facade class holds, and how what is done to it
# reaches the crate. Read by
# `test_every_python_object_a_facade_holds_is_accounted_for` in
# `python/tests/test_music21_rs.py`, which scans `python/src` for
# `#[pyclass]` structs with `Py<...>` fields and fails on a field or class
# missing here, and on a row naming one that no longer exists.
#
# The bugs this guards against have one shape: an object handed out, edited
# in place, and a crate reader that reads the value and never the object.
#
# A class that carries a crate value (an `inner`, a `stored`, a crate stream
# or grouping it reads) has one row per Py field:
#
#   field = { kind = "identity", sync = "synced" }
#       The caller gets this very object back and may edit it. `sync` names
#       the function that folds it into the value before the crate reads it
#       (`synced`, `synced_inner`, `current`, `write_back`, ...), or is
#       "read live" with a `why`: the facade reads the object itself each
#       time, or the crate keeps nothing of it.
#   field = { kind = "value", note = "..." }
#       A copy of something the crate carries, taken when it was set. An
#       edit made in place is not seen: a debt, with what it costs.
#   field = { kind = "cache", note = "..." }
#       Worked out from the value and kept; nothing edits the value through
#       it.
#
# A class with no crate value is listed once, as
#
#   [Class]
#   kind = "facade-only"
#   reason = "..."
#
# and the test refuses that for a class with a field named `inner` or
# `stored`.

