<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>music21-rs Tuning Explorer</title>
        <link rel="modulepreload" href="./app.js" />
        <link rel="modulepreload" href="../pkg/music21_rs_web.js" />
        <style>
            button,
            input,
            select,
            textarea {
                font: inherit;
                color: inherit;
            }

            button {
                cursor: pointer;
            }

            .layout {
                display: grid;
                grid-template-columns: minmax(260px, 340px) minmax(0, 1fr);
                gap: 18px;
                align-items: start;
            }

            .column {
                display: grid;
                gap: 18px;
                min-width: 0;
            }

            section {
                border: 1px solid var(--line);
                border-radius: 8px;
                background: var(--panel);
                overflow: hidden;
            }

            section h2 {
                margin: 0;
                padding: 14px 16px;
                border-bottom: 1px solid var(--line);
                font-size: 15px;
            }

            section h2 .aside {
                float: right;
                color: var(--muted);
                font-size: 12px;
                font-weight: 600;
            }

            .find {
                display: grid;
                gap: 8px;
                padding: 12px;
                border-bottom: 1px solid var(--line);
                background: var(--panel-soft);
            }

            .find input[type="search"] {
                width: 100%;
                height: 44px;
                padding: 0 12px;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: var(--panel);
            }

            .find input[type="search"]:focus {
                border-color: var(--accent);
                outline: none;
            }

            .chips {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }

            .chip {
                height: 30px;
                padding: 0 10px;
                border: 1px solid var(--line);
                border-radius: 999px;
                background: var(--panel);
                color: var(--muted);
                font-size: 12px;
                font-weight: 700;
            }

            .chip.active {
                border-color: var(--accent);
                background: var(--accent-soft);
                color: var(--ink);
            }

            .chip small {
                margin-left: 3px;
                font-weight: 400;
            }

            .picker {
                max-height: calc(100vh - 300px);
                min-height: 200px;
                overflow: auto;
            }

            .picker-form {
                display: grid;
                gap: 8px;
                padding: 12px;
                border-bottom: 1px solid var(--line);
            }

            .picker-form label {
                display: grid;
                gap: 5px;
                color: var(--muted);
                font-size: 12px;
                font-weight: 700;
                text-transform: uppercase;
            }

            .picker-form input,
            .picker-form textarea {
                width: 100%;
                min-height: 44px;
                padding: 8px 12px;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: var(--panel);
                font-weight: 400;
                text-transform: none;
            }

            .picker-form textarea {
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 12px;
            }

            .group {
                position: sticky;
                top: 0;
                z-index: 1;
                display: flex;
                justify-content: space-between;
                padding: 6px 12px;
                border-bottom: 1px solid var(--line);
                background: var(--panel-soft);
                color: var(--muted);
                font-size: 11px;
                font-weight: 800;
                letter-spacing: 0.05em;
                text-transform: uppercase;
            }

            .item {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 2px 10px;
                width: 100%;
                min-height: 44px;
                padding: 8px 12px;
                border: 0;
                border-bottom: 1px solid var(--line);
                background: transparent;
                text-align: left;
            }

            .item:hover {
                background: var(--accent-soft);
            }

            .item.active {
                background: var(--accent-soft);
                box-shadow: inset 3px 0 0 var(--accent);
            }

            .item .name {
                overflow: hidden;
                font-weight: 700;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .item .steps {
                color: var(--muted);
                font-size: 12px;
                font-variant-numeric: tabular-nums;
                white-space: nowrap;
            }

            .item .sub {
                grid-column: 1 / -1;
                overflow: hidden;
                color: var(--muted);
                font-size: 12px;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .note {
                padding: 10px 12px;
                color: var(--muted);
                font-size: 13px;
            }

            .facts {
                display: flex;
                flex-wrap: wrap;
                gap: 8px 16px;
                padding: 12px 16px;
                color: var(--muted);
                font-size: 13px;
            }

            .facts b {
                color: var(--ink);
                font-weight: 700;
            }

            .facts input {
                width: 7.5em;
                height: 28px;
                padding: 0 6px;
                border: 1px solid var(--line);
                border-radius: 6px;
                background: var(--panel);
                font-variant-numeric: tabular-nums;
            }

            .sizes {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                align-items: center;
                padding: 0 16px 12px;
                color: var(--muted);
                font-size: 13px;
            }

            .sizes:empty {
                display: none;
            }

            .sizes button {
                min-width: 34px;
                height: 30px;
                padding: 0 8px;
                border: 1px solid var(--line);
                border-radius: 6px;
                background: var(--panel);
                font-variant-numeric: tabular-nums;
            }

            .sizes button.active {
                border-color: var(--accent);
                background: var(--accent-soft);
                color: var(--ink);
            }

            .keys {
                display: flex;
                gap: 3px;
                padding: 12px;
                overflow-x: auto;
                overscroll-behavior-x: contain;
                touch-action: pan-x;
                user-select: none;
                -webkit-user-select: none;
            }

            .key {
                display: grid;
                flex: 0 0 auto;
                width: 52px;
                height: 118px;
                align-content: end;
                gap: 2px;
                padding: 6px 4px;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: var(--panel-soft);
                text-align: center;
                touch-action: none;
            }

            .key.dark {
                background: var(--panel-softer);
            }

            .key.first {
                border-color: var(--accent-line);
            }

            .key.down {
                border-color: var(--accent);
                background: var(--accent);
                color: var(--accent-ink);
            }

            .key strong {
                font-size: 12px;
                line-height: 1.15;
                overflow-wrap: anywhere;
            }

            .key small {
                font-size: 10px;
                opacity: 0.75;
                font-variant-numeric: tabular-nums;
            }

            .key kbd {
                display: inline-block;
                min-width: 16px;
                margin-top: 2px;
                padding: 1px 4px;
                border: 1px solid currentColor;
                border-radius: 4px;
                font-family: inherit;
                font-size: 10px;
                opacity: 0.6;
            }

            .bar {
                display: flex;
                flex-wrap: wrap;
                gap: 8px 12px;
                align-items: end;
                padding: 12px;
                border-top: 1px solid var(--line);
            }

            .field {
                display: grid;
                gap: 5px;
                min-width: 0;
            }

            .field span {
                color: var(--muted);
                font-size: 12px;
                font-weight: 700;
                text-transform: uppercase;
            }

            .bar select,
            .bar input[type="number"] {
                height: 44px;
                padding: 0 10px;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: var(--panel);
            }

            .bar input[type="number"] {
                width: 5em;
            }

            .bar input[type="range"] {
                width: 110px;
                height: 44px;
            }

            .primary,
            .secondary {
                height: 44px;
                padding: 0 16px;
                border-radius: 8px;
                font-weight: 700;
                white-space: nowrap;
            }

            .primary {
                border: 0;
                background: var(--accent);
                color: #fff;
            }

            .primary:hover {
                background: var(--accent-strong);
            }

            .secondary {
                border: 1px solid var(--line);
                background: var(--panel);
                color: var(--accent-strong);
            }

            .secondary:hover,
            .secondary.on,
            .secondary.copied {
                border-color: var(--accent);
                background: var(--accent-soft);
            }

            .bar .status {
                flex: 1 1 100%;
                color: var(--muted);
                font-size: 12px;
                font-weight: 700;
            }

            .table-wrap {
                overflow-x: auto;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                font-size: 14px;
                font-variant-numeric: tabular-nums;
            }

            th,
            td {
                padding: 8px 12px;
                border-bottom: 1px solid var(--line);
                text-align: left;
                white-space: nowrap;
            }

            tr:last-child td {
                border-bottom: 0;
            }

            th {
                color: var(--muted);
                font-size: 12px;
                text-transform: uppercase;
            }

            tr.playing td {
                background: var(--accent-soft);
            }

            td.play {
                width: 1%;
            }

            td.play .secondary {
                height: 32px;
                padding: 0 12px;
            }

            .cents {
                display: grid;
                grid-template-columns: 66px 70px;
                gap: 8px;
                align-items: center;
            }

            .cents-track {
                position: relative;
                height: 6px;
                border-radius: 3px;
                background: var(--line);
            }

            .cents-fill {
                position: absolute;
                top: 0;
                left: 50%;
                height: 100%;
                background: var(--accent);
            }

            .cents-fill.negative {
                right: 50%;
                left: auto;
                background: var(--warn);
            }

            .about {
                padding: 12px 16px;
                color: var(--muted);
                font-size: 14px;
                line-height: 1.5;
            }

            .about p {
                margin: 0 0 8px;
            }

            .about p:last-child {
                margin-bottom: 0;
            }

            .about a {
                color: var(--accent-strong);
            }

            .error {
                display: none;
                margin: 0 0 16px;
                padding: 12px 14px;
                border: 1px solid var(--warn-line);
                border-radius: 8px;
                background: var(--warn-soft);
                color: var(--warn);
                font-weight: 700;
            }

            #browse {
                display: none;
            }

            @media (max-width: 760px) {
                .layout {
                    grid-template-columns: 1fr;
                }

                #library {
                    display: none;
                }

                body.browsing #library {
                    display: block;
                }

                #browse {
                    display: inline-flex;
                    align-items: center;
                    height: 36px;
                    margin: 0 16px 12px;
                    padding: 0 12px;
                }

                .picker {
                    max-height: 55vh;
                }

                .board {
                    position: sticky;
                    bottom: 8px;
                    z-index: 2;
                    box-shadow: 0 10px 30px rgb(0 0 0 / 0.25);
                }

                .key {
                    width: 46px;
                    height: 100px;
                }

                .bar .status {
                    display: none;
                }

                th,
                td {
                    padding: 8px;
                }
            }
        </style>
        <link rel="stylesheet" href="../theme.css" />
    </head>
    <body class="page-tuning">
        <main class="shell">
            <header>
                <div class="title-row">
                    <a class="home-link" href="../">Home</a>
                    <h1>Tuning Explorer</h1>
                </div>
                <nav class="top-links">
                    <a href="../chord/">Chord Inspector</a>
                    <a href="../chords/">Chord Browser</a>
                    <a href="../polyrhythm/">Polyrhythm</a>
                    <a href="../harte/">Harte</a>
                    <a href="../roman/">Roman Numerals</a>
                    <a href="../scales/">Scales</a>
                    <a href="../serial/">Tone Rows</a>
                    <a id="docs-link" href="../docs/music21_rs/index.html"
                        >Rust docs</a
                    >
                </nav>
            </header>
            <p class="error" id="error"></p>
            <div class="layout">
                <section id="library">
                    <h2>Browse</h2>
                    <div class="find">
                        <input
                            id="search"
                            type="search"
                            placeholder="Search tunings, temperaments and Scala scales"
                            autocomplete="off"
                        />
                        <div class="chips" id="chips">
                            <button class="chip active" type="button" data-kind="all">
                                All
                            </button>
                            <button class="chip" type="button" data-kind="system">
                                Systems<small id="count-system"></small>
                            </button>
                            <button class="chip" type="button" data-kind="temperament">
                                Temperaments<small id="count-temperament"></small>
                            </button>
                            <button class="chip" type="button" data-kind="equal">
                                Equal<small id="count-equal"></small>
                            </button>
                            <button class="chip" type="button" data-kind="scala">
                                Scala<small id="count-scala"></small>
                            </button>
                            <button class="chip" type="button" data-kind="mine">
                                Mine
                            </button>
                        </div>
                    </div>
                    <div class="picker" id="picker"></div>
                </section>
                <div class="column">
                    <section>
                        <h2 id="title">Loading</h2>
                        <div class="facts" id="facts"></div>
                        <div class="sizes" id="sizes"></div>
                        <button id="browse" class="secondary" type="button">
                            Browse scales
                        </button>
                    </section>
                    <section class="board">
                        <h2>
                            Play
                            <span class="aside" id="status"
                                >Tap the keys, or play them from your computer
                                keyboard. Middle C on a MIDI keyboard is the
                                root.</span
                            >
                        </h2>
                        <div class="keys" id="keys"></div>
                        <div class="bar">
                            <label class="field">
                                <span>Keys</span>
                                <select id="layout">
                                    <option value="auto">Auto</option>
                                    <option value="piano">Piano rows</option>
                                    <option value="rows">Rows of degrees</option>
                                    <option value="periods">
                                        A period per row
                                    </option>
                                </select>
                            </label>
                            <label class="field">
                                <span>Octave</span>
                                <input
                                    id="transpose"
                                    type="number"
                                    min="-4"
                                    max="4"
                                    value="0"
                                />
                            </label>
                            <label class="field">
                                <span>Wave</span>
                                <select id="waveform">
                                    <option value="sine">Sine</option>
                                    <option value="triangle">Triangle</option>
                                    <option value="square">Square</option>
                                    <option value="sawtooth">Sawtooth</option>
                                </select>
                            </label>
                            <label class="field">
                                <span>Volume</span>
                                <input
                                    id="volume"
                                    type="range"
                                    min="0"
                                    max="1"
                                    step="0.01"
                                    value="0.3"
                                />
                            </label>
                            <button id="play-scale" class="primary" type="button">
                                Play scale
                            </button>
                            <button id="stop" class="secondary" type="button">
                                Stop
                            </button>
                            <button id="midi" class="secondary" type="button">
                                MIDI
                            </button>
                            <button id="share" class="secondary" type="button">
                                Copy link
                            </button>
                        </div>
                    </section>
                    <section>
                        <h2>Degrees</h2>
                        <div class="table-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Degree</th>
                                        <th>Name</th>
                                        <th>Ratio</th>
                                        <th>Hz</th>
                                        <th>From equal</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="degrees"></tbody>
                            </table>
                        </div>
                    </section>
                    <section>
                        <h2>About</h2>
                        <div class="about" id="about"></div>
                    </section>
                </div>
            </div>
        </main>
        <script type="module" src="./app.js"></script>
    </body>
</html>
