[package]
authors = ["hill <hill@hilll.dev>"]
description = "Repository maintenance tasks for music21-rs"
edition = "2024"
license-file = "../LICENSE"
name = "xtask"
publish = false
repository = "https://github.com/float3/music21-rs"
version = "0.1.0"

[features]
default = []
python = ["dep:pyo3", "dep:reqwest", "dep:music21_rs_python"]

[dependencies]
# The crate itself, so the benchmark can time it with no Python in the way
# beside timing it through the wheel. Only the `bench` command reads it.
music21-rs = { path = ".." }
# The wheel crate, linked in rather than installed, so music21's own suite can
# be run against the crate that is compiled here as well as against the wheel
# that ships. Renamed because the wheel crate's lib is also `music21_rs`, which
# is the name the extension module has to have.
music21_rs_python = { package = "music21-rs-python", path = "../python", optional = true }
proc-macro2 = "1.0.106"
pyo3 = { version = "0.29.0", features = ["auto-initialize"], optional = true }
quote = "1.0.45"
reqwest = { version = "0.13.3", features = ["blocking"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

[lints]
workspace = true
