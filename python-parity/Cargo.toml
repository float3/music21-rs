[package]
edition = "2024"
name = "music21-rs-python-parity"
publish = false
version = "0.0.0"
# One test binary, `tests/main.rs`, rather than one per file: the archive
# CI carries to its shards is a fraction of the size, and links once.
autotests = false

[[test]]
name = "parity"
path = "tests/main.rs"

[dependencies]
music21 = { path = "..", default-features = false, features = [
    "language-detection",
    "musicxml",
] }
# The wheel crate, whose library is `music21_rs`, the extension module's
# name; taken as `music21_rs_python` so the code says which half it means.
# The bundled Scala archive comes with it: music21's own `scale.scala`
# examples ask for a scale by name, and the archive is where a name is
# answered. The wheel leaves that feature off.
music21_rs_python = { package = "music21-rs-python", path = "../python", features = [
  "scala-archive",
] }
pyo3 = { version = "0.29.0", features = ["auto-initialize"] }
# Only the parity tests need it: music21 reads a regular expression out of a
# metadata search query, and the crate hands that engine's choice to the
# caller. This crate is not published, so the weight is a test's alone.
regex = "1.12"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1"
utils = { path = "../utils", features = ["python"] }

# The workspace denies these for every crate in it; this crate is outside the
# workspace, so it says so itself rather than going unlinted.
[lints.clippy]
all = { level = "deny", priority = -1 }

# The tests compare whole corpus scores, and the crate unoptimized is most of
# the time on the largest ones. Line tables are all the debug information a
# failing test's backtrace reads; the rest only made the test binary larger
# and slower to link, and to carry from the build to the shards in CI.
[profile.dev]
opt-level = 2
debug = "line-tables-only"
