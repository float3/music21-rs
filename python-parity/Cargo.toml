[package]
edition = "2024"
name = "music21-rs-python-parity"
publish = false
version = "0.0.0"

[dependencies]
music21-rs = { path = "..", default-features = false }
# Renamed because the wheel crate's lib is also called `music21_rs`,
# which is the name the extension module has to have.
music21_rs_python = { package = "music21-rs-python", path = "../python" }
pyo3 = { version = "0.29.0", features = ["auto-initialize"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1"
utils = { path = "../utils", features = ["python"] }

# The workspace denies these for every crate in it; this crate is outside the
# workspace, so it says so itself rather than going unlinted.
[lints.clippy]
all = { level = "deny", priority = -1 }
