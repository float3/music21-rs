[package]
authors = ["hill <hill@hilll.dev>"]
description = "music21-shaped Python classes over the music21-rs crate"
edition = "2024"
license = "AGPL-3.0-only"
name = "music21-rs-python"
publish = false
repository = "https://github.com/float3/music21-rs"
# Kept in step with the root crate by `wheel_version_matches_the_crate`.
version = "0.5.0"

# `cdylib` is the wheel maturin builds; `rlib` is what `python-parity` links
# against so music21's own doctests run against these very classes.
[lib]
crate-type = ["cdylib", "rlib"]
name = "music21_rs"

[dependencies]
# Under a name of its own: this crate's own library is also called
# `music21_rs`, and rustdoc will not build a doctest against two externs of
# one name — which is why `cargo test` here could never run them.
music21_rs_crate = { package = "music21-rs", path = "..", default-features = false, features = [
  "serde",
] }
pyo3 = "0.29.0"
# A facade object is pickled by writing its musical half out as text, which
# is what music21 does to freeze a score.
serde = "1"
serde_json = "1"

[features]
# maturin turns this on when it builds the wheel: an extension module must
# not link libpython, while `python-parity` embeds an interpreter and must.
extension-module = ["pyo3/extension-module"]

# The workspace denies these for every crate in it; this crate is outside the
# workspace, so it says so itself rather than going unlinted.
[lints.clippy]
all = { level = "deny", priority = -1 }
