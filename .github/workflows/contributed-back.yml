name: Contributed Back

# Keeps the READMEs' contributed-back list in step with GitHub once a day:
# "(open)" follows each linked pull request and issue, and a music21 pull
# request the list lacks is added with its title. Whatever changes is
# committed straight to master.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributed-back
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  contributed-back:
    name: Contributed Back
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: contributed-back

      - name: Bring the list up to date
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --release -p xtask -- contributed-back

      - name: Commit the list
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md python/README.md; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Contributed-back list: follow GitHub" -- README.md python/README.md
          git push origin HEAD:master
