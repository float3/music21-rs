name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  nix:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # No Nix cache. `magic-nix-cache-action` wrote a cache entry per store
      # path -- 451 `.nar.zstd` and 455 `.narinfo` entries, 906 of the
      # repository's 948 -- to hold about a gigabyte, and the eviction that
      # caused fell on the cargo caches, which are what the run's wall clock
      # actually turns on. This job checks formatting and evaluates the flake;
      # it is not worth a cache, let alone that one. (Determinate Systems have
      # since retired the action.)
      - name: Check Nix formatting with Alejandra
        run: nix shell nixpkgs#alejandra -c alejandra --check .

      - name: Validate flake
        run: nix flake check --accept-flake-config

  feature-matrix:
    name: Feature Matrix (${{ matrix.feature_set.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature_set:
          - name: none
            flags: --no-default-features
            single_threaded: false
          - name: serde
            flags: --no-default-features --features serde
            single_threaded: false
          - name: all-features
            flags: --all-features
            single_threaded: false
    steps:
      # No submodules. Nothing under `src/` opens a file at all -- the
      # generated tables are compiled-in Rust, not `include_str!` -- so
      # `cargo test --workspace` cannot reach `music21/` or `hexatone/`, and
      # the tests that do need them live in `python-parity`, outside the
      # workspace. That is 228 MB of checkout this job was paying for.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      # One cache for every job building the same graph, not one per job.
      # Sixteen job-scoped keys held 8.4 GB of the repository's 10 GB cache
      # limit, so GitHub was evicting them and some job started cold on most
      # runs. `workspace-stable` is shared with `lint`, `test` and `semver`;
      # `xtask-python` is the other group, for the jobs that build pyo3.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-stable

      - name: Check / Clippy / Test
        shell: bash
        run: |
          set -euo pipefail

          FLAGS="${{ matrix.feature_set.flags }}"
          SINGLE_THREADED="${{ matrix.feature_set.single_threaded }}"

          cargo check --workspace --all-targets $FLAGS
          cargo clippy --workspace --all-targets $FLAGS -- -D warnings
          if [[ "$SINGLE_THREADED" == "true" ]]; then
            cargo test --workspace --all-targets $FLAGS -- --test-threads=1
          else
            cargo test --workspace --all-targets $FLAGS
          fi
          # `--all-targets` excludes doctests, so they need their own run.
          cargo test --workspace --doc $FLAGS

  python-parity:
    name: Python Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask-python

      # The doctest harness imports the whole of music21, which needs its
      # own dependencies; the table bridge stubs them out and does not.
      - name: Install music21's dependencies
        run: python -m pip install chardet joblib jsonpickle more_itertools numpy requests webcolors

      - name: Run Python parity tests
        shell: bash
        run: |
          set -euo pipefail

          export PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          echo "Using PYO3_PYTHON=$PYO3_PYTHON"
          cargo test --manifest-path python-parity/Cargo.toml -- --test-threads=1

  wheel:
    name: Python Wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: python

      - name: Build the wheel
        run: |
          python -m pip install "maturin>=1.7,<2" pytest
          maturin build --release --manifest-path python/Cargo.toml --out target/wheels

      # Installed from the wheel rather than `maturin develop`, so what the
      # tests import is what a user would get.
      - name: Install and test it
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-index --find-links target/wheels music21-rs
          python -m pytest python/tests -q

      # Somebody else's music21 library, run twice: once on music21 and once
      # on ours. The two sets of failures have to match.
      - name: Test a downstream music21 library against it
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install music21 lark numpy
          cargo run --release -p xtask -- downstream
        env:
          PYO3_PYTHON: python

      - name: Upload the wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: target/wheels/*.whl

  # music21's own test suite, run twice and diffed: once on music21, once
  # with `music21_rs.install_into_music21()` in front of it. music21's suite
  # has failures of its own in any environment, so the gate is the comparison
  # and not a pass mark — anything failing only under `music21_rs` is a gap
  # here. It is the harshest measure the repository has, exercising the
  # MusicXML importer, the stream machinery, `freezeThaw` and the corpus.
  #
  # The wheel is downloaded rather than rebuilt: `wheel` already built the
  # very artifact this should be measuring, and a rebuild underneath a run
  # gives numbers that mean nothing.
  music21-suite:
    name: music21's Own Suite
    runs-on: ubuntu-latest
    needs: wheel
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask-python

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download the wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel-ubuntu-latest
          path: target/wheels

      # music21's own dependencies, plus what its *test* suite needs on top:
      # scipy and python-Levenshtein.
      - name: Install music21's dependencies and its test dependencies
        run: |
          python -m pip install chardet joblib jsonpickle more_itertools numpy requests webcolors
          python -m pip install scipy python-Levenshtein

      - name: Install the wheel
        run: python -m pip install --no-index --find-links target/wheels music21-rs

      # The suite driver embeds an interpreter through pyo3, so it needs
      # xtask's `python` feature; the wheel it measures is the downloaded one,
      # imported by name from the interpreter this points at.
      - name: Run music21's suite on music21 and on music21_rs
        run: cargo run --release -p xtask --features python -- music21-suite
        env:
          PYO3_PYTHON: python

  lint:
    name: Lint (fmt + clippy + check)
    runs-on: ubuntu-latest
    steps:
      # No submodules: every `verify-*` command below compares a committed
      # `data/*.toml` against the Rust emitted from it and reads nothing else,
      # and neither fmt, clippy nor check leaves the workspace.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-stable

      # The reports page's script is TypeScript, and the JavaScript the page
      # carries is generated from it and committed, so verifying the two
      # agree needs a TypeScript compiler here.
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # `python` and `python-parity` are outside the workspace, so `--all`
      # does not reach them and they are named here.
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path python/Cargo.toml --all -- --check
          cargo fmt --manifest-path python-parity/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Verify generated chord tables
        run: cargo run --release -p xtask -- verify-tables

      - name: Verify generated tuning tables
        run: cargo run --release -p xtask -- verify-tuning-tables

      - name: Verify bundled Scala archive index
        run: cargo run --release -p xtask -- verify-scala-archive

      # The wiki temperaments have no `regenerate` half — the wiki answers 403
      # to every non-browser client, so `data/temperaments.toml` is collected
      # by hand. This only checks the committed Rust still matches it.
      - name: Verify generated wiki temperaments
        run: cargo run --release -p xtask -- verify-temperaments

      - name: Verify the reports page's compiled script
        run: cargo run --release -p xtask -- verify-report-script

      # `--locked` is what says a change touching dependencies committed the
      # updated `Cargo.lock`. It used to be a job of its own doing nothing
      # else; `--all-targets` here is the stronger check for none of the cost.
      - name: Cargo check
        run: cargo check --workspace --all-targets --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Read the floor out of the manifest so the two cannot drift apart.
      - name: Read the declared MSRV
        id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Only the published crate: the examples pull in cpal and wasm-bindgen,
      # whose own floors are no promise this crate makes.
      - name: Check the published crate on its declared MSRV
        run: cargo check --package music21-rs --all-features --locked

  semver:
    name: Semver Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-stable

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      # `fraction` is a public dependency and the release job tags whatever
      # version reaches master, so a breaking change has to be caught before
      # the tag rather than after it.
      - name: Compare the public API against the base commit
        env:
          BASELINE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^' }}
        run: cargo semver-checks --package music21-rs --all-features --baseline-rev "$BASELINE"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # No submodules. Nothing under `src/` opens a file at all -- the
      # generated tables are compiled-in Rust, not `include_str!` -- so
      # `cargo test --workspace` cannot reach `music21/` or `hexatone/`, and
      # the tests that do need them live in `python-parity`, outside the
      # workspace. That is 228 MB of checkout this job was paying for.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-stable

      - name: Cargo test
        run: cargo test --workspace --all-targets

      # `--all-targets` excludes doctests, so they need their own run.
      - name: Cargo test (doctests)
        run: cargo test --workspace --doc

  docs:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `doc_cfg` is a nightly rustdoc feature, so the documentation build --
      # and only that -- runs on nightly. rust-toolchain.toml pins every other
      # command in this job to stable.
      - name: Install nightly rustdoc
        uses: dtolnay/rust-toolchain@nightly

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask-python

      # Built the way docs.rs builds it: every feature on, so the `serde` impls
      # and `ScalaArchive::bundled()` are documented at all, and `--cfg docsrs`
      # so each gated item says which feature gates it rather than looking
      # unconditional. One site therefore covers every feature combination.
      - name: Build docs
        shell: bash
        run: |
          set -euo pipefail

          # The whole workspace at its defaults, then the published crate
          # again with everything on -- in that order, so the full version of
          # music21-rs is the one left in target/doc. `--workspace
          # --all-features` in one go would also turn on `utils` and `xtask`'s
          # `python` feature, dragging pyo3 and reqwest into a documentation
          # build with no use for either.
          cargo +nightly doc --workspace --no-deps
          cargo +nightly doc --package music21-rs --all-features --no-deps
        env:
          RUSTDOCFLAGS: --cfg docsrs

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The report runs every suite, so this job needs what those suites need:
      # music21's own dependencies for the doctest harness, and maturin and
      # pytest for the wheel.
      - name: Install the suites' dependencies
        run: |
          python -m pip install chardet joblib jsonpickle more_itertools numpy requests webcolors
          python -m pip install "maturin>=1.7,<2" pytest pdoc

      # The wheel's own tests import music21_rs, so the wheel has to be
      # installed before the report runs them; the report rebuilds it, which
      # is cheap once cargo has cached the artifacts. The Python API docs are
      # read off the installed module, so they need it too.
      - name: Install the wheel the report tests
        run: |
          maturin build --release --manifest-path python/Cargo.toml --out target/wheels
          python -m pip install --no-index --find-links target/wheels music21-rs

      # pdoc imports music21_rs and renders what the classes carry: their
      # docstrings and, for every method, the signature pyo3 emits.
      - name: Build Python API docs
        run: pdoc -o target/pythondocs music21_rs

      # Coverage, every test suite, and the ported feature set, published
      # beside the docs. The feature half also fails when data/feature_map.toml
      # has gone stale.
      # The benchmark and music21's suite are subcommands of this same
      # program now, and the report drives them by running itself, so the
      # binary it builds has to be the one with pyo3 in it.
      #
      # On a pull request only the feature half runs. The other half re-runs
      # the workspace tests, the doctests, the parity suite, the wheel and
      # music21's own suite -- all of which this workflow has just run in
      # parallel as jobs of their own -- and then re-runs them serially and
      # under coverage instrumentation, which took thirteen of this job's
      # fifteen minutes and set the whole workflow's wall clock. The page it
      # measures is never uploaded from a pull request either: `Configure
      # Pages` and `Upload docs artifact` below are both push-only. What is
      # worth keeping on a pull request is the feature-map staleness check,
      # which is the one part of this job that can fail on a code change, and
      # `--features-only` is exactly that part.
      - name: Build reports
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" ]]; then
            cargo run --release -p xtask --features python -- report --out target/reports
          else
            cargo run --release -p xtask --features python -- report --features-only --out target/reports
          fi
        env:
          PYO3_PYTHON: python

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build web WASM package
        working-directory: examples/web
        run: wasm-pack build --release --target web --out-dir pkg --out-name music21_rs_web

      - name: Build web TypeScript
        working-directory: examples/web
        run: npx --yes --package typescript@5.9.3 tsc -p tsconfig.json

      - name: Build demo site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf target/pages
          mkdir -p target/pages/chord
          mkdir -p target/pages/chords
          mkdir -p target/pages/docs
          mkdir -p target/pages/polyrhythm
          mkdir -p target/pages/python
          mkdir -p target/pages/tuning
          cp -R target/doc/. target/pages/docs/
          cp -R target/pythondocs/. target/pages/python/
          cp -R target/reports target/pages/reports
          cp examples/web/help-tooltips.js target/pages/help-tooltips.js
          cp examples/web/theme.css target/pages/theme.css
          cp examples/web/theme.js target/pages/theme.js
          cp examples/web/index.html target/pages/index.html
          cp examples/web/chord/index.html target/pages/chord/index.html
          cp examples/web/chord/app.js target/pages/chord/app.js
          cp examples/web/chords/index.html target/pages/chords/index.html
          cp examples/web/chords/app.js target/pages/chords/app.js
          cp examples/web/polyrhythm/index.html target/pages/polyrhythm/index.html
          cp examples/web/polyrhythm/app.js target/pages/polyrhythm/app.js
          cp examples/web/tuning/index.html target/pages/tuning/index.html
          cp examples/web/tuning/app.js target/pages/tuning/app.js
          cp -R examples/web/pkg target/pages/pkg

      - name: Smoke check demo site
        shell: bash
        env:
          FULL_REPORT: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path("target/pages")
          required_files = [
              "index.html",
              "chord/index.html",
              "chords/index.html",
              "pkg/music21_rs_web.js",
              "pkg/music21_rs_web_bg.wasm",
              "help-tooltips.js",
              "theme.css",
              "theme.js",
              "docs/music21_rs/index.html",
              "python/index.html",
              "python/music21_rs.html",
              "chord/app.js",
              "chords/app.js",
              "polyrhythm/index.html",
              "polyrhythm/app.js",
              "tuning/index.html",
              "tuning/app.js",
              "reports/index.html",
              "reports/report.json",
          ]

          # Only a push measures coverage; a pull request builds the feature
          # half alone, which writes no coverage page to check for.
          if os.environ.get("FULL_REPORT") == "true":
              required_files.append("reports/coverage/html/index.html")

          missing = [name for name in required_files if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"missing demo build output: {', '.join(missing)}")

          file_checks = {
              "index.html": ["chord/", "chords/", "polyrhythm/", "tuning/", "reports/", "./python/", "./theme.css", "./theme.js"],
              "python/music21_rs.html": ["id=\"Chord\"", "id=\"Pitch\"", "id=\"Pitch.transpose\"", "install_into_music21"],
              "reports/index.html": ["../theme.css", "../theme.js"],
              "theme.css": ["--accent", ":root[data-theme=\"dark\"]", ".theme-toggle"],
              "chord/index.html": ["./app.js", "../theme.css", "../chords/", "../polyrhythm/"],
              "chord/app.js": ["../help-tooltips.js", "../theme.js", "../pkg/music21_rs_web.js"],
              "chords/index.html": ["./app.js", "../theme.css", "../chord/"],
              "chords/app.js": ["../help-tooltips.js", "../theme.js", "../pkg/music21_rs_web.js"],
              "polyrhythm/index.html": ["./app.js", "../theme.css"],
              "polyrhythm/app.js": ["../help-tooltips.js", "../theme.js"],
              "tuning/index.html": ["./app.js", "../theme.css"],
              "tuning/app.js": ["../theme.js"],
          }

          if os.environ.get("FULL_REPORT") == "true":
              file_checks["reports/index.html"].append("./coverage/html/index.html")

          for name, needles in file_checks.items():
              text = (root / name).read_text(encoding="utf-8")
              missing_needles = [needle for needle in needles if needle not in text]
              if missing_needles:
                  joined = ", ".join(missing_needles)
                  raise SystemExit(f"{name} is missing expected demo references: {joined}")

          # The timings page exists only where music21's own suite was timed,
          # so it cannot simply be required. What can be required is that the
          # report and the page agree: a report that links to it must ship it.
          report = (root / "reports/index.html").read_text(encoding="utf-8")
          if "./timings.html" in report and not (root / "reports/timings.html").is_file():
              raise SystemExit("reports/index.html links to timings.html, which was not built")
          PY

      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v6

      - name: Upload docs artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/pages

  pages:
    name: Publish Docs
    runs-on: ubuntu-latest
    # Only what the site is made of. Documentation that builds should reach
    # the reader whether or not some other suite is red: gating the deploy on
    # every job meant one stale fixture kept the whole site -- Rust docs,
    # Python docs, reports and demos -- from being republished at all. What
    # must not ship from a red build is a release, and `release` still waits
    # for every job.
    needs:
      - lint
      - docs
    if: github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy docs to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    # Everything the repository gates on. A release is the one thing that
    # cannot be taken back, so it waits for all of it — the wheel job
    # included, which builds and tests the very artifact PyPI then receives.
    needs:
      - nix
      - feature-matrix
      - python-parity
      - wheel
      - music21-suite
      - lint
      - msrv
      - semver
      - test
      - docs
      - pages
    if: github.event_name == 'push'
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.current_version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect package version bump
        id: version
        shell: bash
        run: |
          set -euo pipefail

          read_version() {
            python3 - "$1" <<'PY'
          import pathlib
          import sys
          import tomllib

          print(tomllib.loads(pathlib.Path(sys.argv[1]).read_text())["package"]["version"])
          PY
          }

          current_version="$(read_version Cargo.toml)"
          previous_version=""
          base="${{ github.event.before }}"

          if [[ ! "$base" =~ ^0+$ ]] && git cat-file -e "$base:Cargo.toml" 2>/dev/null; then
            git show "$base:Cargo.toml" > /tmp/previous-Cargo.toml
            previous_version="$(read_version /tmp/previous-Cargo.toml)"
          fi

          changed=true
          if [[ -n "$previous_version" && "$current_version" == "$previous_version" ]]; then
            changed=false
          fi

          {
            echo "changed=$changed"
            echo "current_version=$current_version"
            echo "previous_version=$previous_version"
            echo "tag=v$current_version"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; skipping release."
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

  # ---------------------------------------------------------------------------
  # Publishing. Everything below hangs off `release`, so it can only run for a
  # commit where every other job passed and the version actually changed: one
  # bump, one tag, one crates.io release and one PyPI release, together.
  #
  # Nothing here holds a token but crates.io's. PyPI uses Trusted Publishing,
  # which authenticates the workflow itself over OIDC.
  # ---------------------------------------------------------------------------

  wheels-linux:
    name: Wheels (linux ${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The manylinux image carries every interpreter, so one job per
      # architecture builds the whole column.
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: >-
            --release
            --manifest-path python/Cargo.toml
            --out dist
            --interpreter 3.9 3.10 3.11 3.12 3.13 3.14

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.target }}
          path: dist

  wheels-native:
    name: Wheels (${{ matrix.os }} py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: release
    if: needs.release.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is the x86_64 runner, macos-15 the Apple Silicon
        # one. The plain version numbers are the Apple Silicon images now, so
        # the x86_64 half has to name itself; macos-13 was retired and
        # macos-14 is deprecated.
        os: [windows-latest, macos-15-intel, macos-15]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # setup-python still has no 3.9 build for Apple Silicon -- the
          # manifest carries darwin x64 alone for every 3.9 -- so that one
          # combination installs from the sdist instead.
          - os: macos-15
            python-version: "3.9"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: >-
            --release
            --manifest-path python/Cargo.toml
            --out dist
            --interpreter python

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # maturin vendors the parent crate into the sdist, so it builds without
      # the rest of the repository.
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path python/Cargo.toml --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - release
      - wheels-linux
      - wheels-native
      - sdist
    if: needs.release.outputs.changed == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/music21-rs
    # Trusted Publishing: PyPI trusts this workflow by name, so there is no
    # API token in the repository.
    permissions:
      id-token: write
    steps:
      - name: Collect every wheel and the sdist
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-run of the workflow must not fail on files already uploaded;
          # a version can never be replaced on PyPI.
          skip-existing: true

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs:
      - release
      - wheels-linux
      - wheels-native
      - sdist
    if: needs.release.outputs.changed == 'true'
    environment: crates-io
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Is this version already on crates.io?
        id: published
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.release.outputs.version }}"
          url="https://crates.io/api/v1/crates/music21-rs/$version"
          if curl -sfL -H "User-Agent: music21-rs release workflow" "$url" >/dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.published.outputs.already == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
